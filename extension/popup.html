<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>知乎文章导出</title>
  <style>
    body { width: 340px; margin: 0; padding: 20px; font: 14px/1.5 system-ui, sans-serif; color: #17212e; }
    h1 { margin: 0 0 14px; font-size: 18px; }
    label { display: block; margin-bottom: 6px; }
    input { box-sizing: border-box; width: 100%; padding: 9px; border: 1px solid #bbc5d0; border-radius: 6px; }
    button { width: 100%; margin-top: 12px; padding: 10px; border: 0; border-radius: 6px; background: #1769e0; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    p { min-height: 21px; margin: 12px 0 0; color: #4d5b6a; }
  </style>
</head>
<body>
  <h1>知乎文章导出</h1>
  <form id="form">
    <label for="url">文章链接</label>
    <input id="url" type="url" required value="https://zhuanlan.zhihu.com/p/685176003">
    <button id="submit" type="submit">提取并下载</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
